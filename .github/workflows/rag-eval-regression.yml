name: RAG Evaluation Regression Test

on:
  pull_request:
    paths:
      - 'src/**'
      - 'evaluation/**'

jobs:
  evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Bootstrap Datasets
        run: python scripts/bootstrap_data.py
      - name: Run RAGAS Golden Dataset Eval
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python evaluation/run_eval.py